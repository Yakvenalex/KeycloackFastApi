<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Защищенная страница</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
      <div class="bg-white rounded-lg shadow-lg p-8 max-w-2xl mx-auto">
        <div class="flex justify-between items-center mb-8">
          <h1 class="text-3xl font-bold text-gray-800">Защищенная страница</h1>
          <a
            href="/logout"
            class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg transition duration-300"
          >
            Выйти
          </a>
        </div>

        <div class="bg-gray-50 p-6 rounded-lg">
          <h2 class="text-xl font-semibold mb-4 text-gray-700">
            Информация о пользователе
          </h2>
          <div class="space-y-3">
            <p class="text-gray-600">
              <span class="font-medium">Имя пользователя:</span> {{
              user.preferred_username }}
            </p>
            <p class="text-gray-600">
              <span class="font-medium">Email:</span> {{ user.email }}
            </p>
            <p class="text-gray-600">
              <span class="font-medium">ID:</span> {{ user.sub }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
